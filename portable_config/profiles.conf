[1440p+]
profile-desc=1440p / 4K class sources (short side >= 1440)
profile-cond=not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) >= 1440
profile=HighQuality
glsl-shaders-clr
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

[hd]
profile-desc=720p / 1080p class sources
profile-cond=not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) >= 720 and math.min(get("dwidth", 0), get("dheight", 0)) < 1440
profile=HighQuality
glsl-shaders-clr
glsl-shaders-append="~~/shaders/SSim/SSSR+AdaptiveSharpening_Medium_Sharpening.glsl"
glsl-shaders-append="~~/shaders/Chroma/CfL_Prediction.glsl"
# Tall clips live in this tier but are scaled DOWN on a 16:10 screen: 1080x1920
# only gets 1600 lines of screen, so it renders at 0.83x. SSimDownscaler is the
# shader that should run there. It self-gates on //!WHEN OUTPUT.h LUMA.h <, so
# it stays inert whenever the video is being upscaled instead.
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

[sdtv-ntsc]
profile-desc=SD sources
profile-cond=not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) > 0 and math.min(get("dwidth", 0), get("dheight", 0)) < 720
profile=HighQuality
glsl-shaders-clr
# glsl-shaders-append="~~/shaders/Ani4Kv2 and AniSD/AniSD_ArtCNN_C4F32_i4.glsl"
glsl-shaders-append="~~/shaders/Chroma/CfL_Prediction.glsl"

# Fourth branch of the same switch. Cover art is a real video track, so a
# 600x600 thumbnail used to land in [sdtv-ntsc] and a 3000x3000 one in [1440p+],
# running the shaders on a still JPEG. albumart is true both for pictures
# embedded in audio files and for external cover art, so the three tiers above
# skip those, and this profile also covers audio with no artwork at all.

[audio]
profile-desc=Audio files and cover art, never treated as video
profile-cond=get("current-tracks/video/albumart", false) or (get("current-tracks/audio/id", 0) > 0 and get("current-tracks/video/id", 0) == 0)
glsl-shaders-clr

[HighQuality]
profile-desc=Shared scaling and HDR settings (pulled in by the tiers)
scale=spline36
scale-antiring=0.2
cscale=lanczos
# mitchell + linear-downscaling=no is what SSimDownscaler asks for: it does its
# own light linearization, so mpv must not do it a second time. Switch back to
# dscale=catmull_rom and linear-downscaling=yes if you drop that shader.
dscale=mitchell
linear-downscaling=no
correct-downscaling=yes
sigmoid-upscaling=yes
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
# Default is no, and it is a no-op anyway once advanced scaling forces an
# indirect pass. Only [Fast] turns it on.
allow-delayed-peak-detect=no

# Manual bail-out for weak GPUs or battery. Sticky on purpose: the tiers only
# reapply when their condition flips, so this survives a file change. Run
# 'apply-profile hd' (or reload) to get the shaders back.
[Fast]
profile-desc=Cheap render path, no shaders
glsl-shaders-clr
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
deband=no
dither=no
interpolation=no
hdr-compute-peak=no
hdr-peak-percentile=100
hdr-contrast-recovery=0.0
allow-delayed-peak-detect=yes


# =============================================================================
# VIDEO - misc behaviour
# =============================================================================

# --interpolation is silently ignored unless video-sync is a display- mode.
[interpolation-activate]
profile-desc=Turn on display resampling whenever interpolation is enabled
profile-restore=copy
profile-cond=get("interpolation", false)
video-sync=display-resample

# Replaces [extension.gif]: extension.* auto profiles are soft-deprecated in the
# manual, and this also covers animated webp/apng.
[gif]
profile-desc=Short looping clips (gif / webp / apng)
profile-restore=copy
profile-cond=get("filename", ""):lower():find("%.gif$") or get("filename", ""):lower():find("%.webp$") or get("filename", ""):lower():find("%.apng$")
loop-file=inf
cache=no


# =============================================================================
# WINDOW - picture in picture (apply manually or bind in input.conf)
# =============================================================================

[pip]
profile-desc=Small always on top window in the corner
ontop=yes
on-all-workspaces=yes
force-window-position=no
geometry=100%:100%
autofit=30%x30%

[pip-off]
profile-desc=Undo [pip], back to the mpv.conf default window size
ontop=no
on-all-workspaces=no
force-window-position=no
geometry=50%:50%
autofit=75%x75%


# =============================================================================
# AUDIO - automatic downmix to stereo
#
# Four exclusive branches, same rule as the video tiers: each one owns the whole
# af chain, and none of them uses profile-restore. A restore is what pulled the
# downmix back out mid-file. audio-params is the format the decoder outputs, and
# it goes briefly unavailable while the AO chain reinitialises - which inserting
# this very filter causes - so the nil safe get() returned 0, '== 6' turned
# false, and profile-restore=copy put back the af list from before the profile,
# i.e. an empty one. The filter never came back, because the condition being
# true again is not a false->true transition once it has been restored.
#
# Every branch also demands channel-count > 0, so that unavailable moment
# matches nothing at all instead of falling into the stereo branch below.
#
# Comment out the profile-cond lines if you get a real surround setup.
# =============================================================================

[Downmix_Audio_5_1]
profile-desc=5.1 to stereo, dialogue lift and LFE lowpass
profile-cond=get("audio-params/channel-count", 0) == 6
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Downmix_Audio_7_1]
profile-desc=7.1 to stereo, dialogue lift and LFE lowpass
profile-cond=get("audio-params/channel-count", 0) == 8
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"

# Anything else that is not stereo (3.0, 4.0, 5.0, 6.1 ...) gets libavfilter's
# standard downmix instead of being left untouched.
[Downmix_Audio_Other]
profile-desc=Any other multichannel layout to stereo
profile-cond=get("audio-params/channel-count", 0) > 2 and get("audio-params/channel-count", 0) ~= 6 and get("audio-params/channel-count", 0) ~= 8
af=lavfi="aformat=channel_layouts=stereo"

# Mono and stereo sources clear the chain, instead of inheriting the pan matrix
# from the previous file. Feeding pan=stereo|FL=0.5*FC+0.707*BL+... a stereo
# input fails: there is no FC, BL or LFE to read from.
[Downmix_Audio_Stereo]
profile-desc=Mono / stereo sources, no filter
profile-cond=get("audio-params/channel-count", 0) > 0 and get("audio-params/channel-count", 0) <= 2
af-clr
